[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".local", "node_modules", "apps/api/alembic/schema_0001.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.security.require"]

[tool.pytest.ini_options]
testpaths = ["tests"]
